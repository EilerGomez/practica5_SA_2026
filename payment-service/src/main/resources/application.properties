spring.application.name=payment-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/payments_db
spring.datasource.username=postgres
spring.datasource.password=postgresql
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

# ===== Simulacion de fallos para las demos =====
# false = el servicio responde normal
# true  = todos los cobros fallan
simulacion.fallo-activo=false
# Milisegundos de retraso artificial. Sirve para disparar timeouts.
simulacion.retraso-ms=0