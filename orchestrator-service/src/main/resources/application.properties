spring.application.name=orchestrator-service
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/saga_db
spring.datasource.username=postgres
spring.datasource.password=postgresql
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== URLs de los microservicios =====
servicios.order=http://localhost:8081
servicios.payment=http://localhost:8082
servicios.inventory=http://localhost:8083
servicios.shipping=http://localhost:8084

# ===== Actuator: expone el estado de los circuitos =====
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ===== Resilience4j: configuracion por defecto =====
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

# ===== Circuit Breaker 1: Payment =====
resilience4j.circuitbreaker.instances.payment.base-config=default

# ===== Circuit Breaker 2: Inventory =====
resilience4j.circuitbreaker.instances.inventory.base-config=default

# ===== Timeouts =====
resilience4j.timelimiter.configs.default.timeout-duration=3s
resilience4j.timelimiter.instances.payment.base-config=default
resilience4j.timelimiter.instances.inventory.base-config=default

logging.level.com.poc.orchestrator=DEBUG
logging.level.io.github.resilience4j=DEBUG

# ===== Circuit Breaker 2: Inventory =====
resilience4j.circuitbreaker.instances.inventory.base-config=default
# Los rechazos de negocio NO cuentan para abrir el circuito
resilience4j.circuitbreaker.instances.inventory.ignore-exceptions[0]=com.poc.orchestrator.exceptions.FalloDeNegocioException

management.endpoints.web.cors.allowed-origins=http://localhost:5173
management.endpoints.web.cors.allowed-methods=GET,POST,OPTIONS